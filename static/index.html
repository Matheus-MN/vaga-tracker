<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vaga Tracker — Rastreador de Candidaturas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">🧭</span>
    <div class="brand-text">
      <h1>Vaga Tracker</h1>
      <p>rastreador pessoal de candidaturas</p>
    </div>
  </div>
  <button id="btn-nova" class="btn btn-primary">+ Nova candidatura</button>
</header>

<section class="stats" id="stats">
  <!-- preenchido via JS -->
</section>

<main class="board" id="board">
  <!-- colunas preenchidas via JS -->
</main>

<dialog id="modal-form">
  <form id="form-candidatura" method="dialog">
    <h2 id="form-title">Nova candidatura</h2>

    <input type="hidden" id="f-id" />

    <label>Empresa
      <input id="f-empresa" type="text" required placeholder="Ex: Banco do Nordeste" />
    </label>

    <label>Cargo / vaga
      <input id="f-cargo" type="text" required placeholder="Ex: Estágio em TI" />
    </label>

    <div class="row">
      <label>Status
        <select id="f-status">
          <option value="enviado">Enviado</option>
          <option value="em_processo">Em processo</option>
          <option value="entrevista">Entrevista</option>
          <option value="aprovado">Aprovado</option>
          <option value="rejeitado">Rejeitado</option>
        </select>
      </label>
      <label>Modalidade
        <select id="f-modalidade">
          <option value="Presencial">Presencial</option>
          <option value="Remoto">Remoto</option>
          <option value="Híbrido">Híbrido</option>
        </select>
      </label>
    </div>

    <div class="row">
      <label>Localização
        <input id="f-localizacao" type="text" placeholder="Ex: São Luís/MA" />
      </label>
      <label>Prazo de inscrição
        <input id="f-prazo" type="date" />
      </label>
    </div>

    <label>Link da vaga
      <input id="f-link" type="url" placeholder="https://..." />
    </label>

    <label>Notas
      <textarea id="f-notas" rows="3" placeholder="Requisitos, contatos, observações..."></textarea>
    </label>

    <div class="form-actions">
      <button type="button" id="btn-excluir" class="btn btn-danger" hidden>Excluir</button>
      <span class="spacer"></span>
      <button type="button" id="btn-cancelar" class="btn btn-ghost">Cancelar</button>
      <button type="submit" id="btn-salvar" class="btn btn-primary">Salvar</button>
    </div>
  </form>
</dialog>

<template id="card-template">
  <article class="card" draggable="true">
    <header>
      <h3 class="card-empresa"></h3>
      <span class="card-modalidade"></span>
    </header>
    <p class="card-cargo"></p>
    <footer>
      <span class="card-local"></span>
      <span class="card-prazo"></span>
    </footer>
  </article>
</template>

<script src="/assets/app.js"></script>
</body>
</html>
